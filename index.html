<!DOCTYPE html>
<html>
<head>
	<title>Learn Academy</title>
	<link rel="stylesheet" href="style.css">
	<meta name="viewport" content="width=device-width">
	<style>
		#scareImage { position: fixed; inset: 0; background: #000; z-index: 9999; }
		#scareImage img { width: 100%; height: 100%; object-fit: cover; }
	</style>
</head>
<body>
	<div id="scareImage">
		<img src="scare.jpg" alt="">
	</div>
	<audio id="audio" src="scream2.mp3" preload="auto"></audio>

	<script>
		var audio = document.getElementById("audio");

		function playScream() {
			audio.muted = false;
			audio.currentTime = 0;
			audio.play().catch(function () {});
		}

		// Пробуем сразу при загрузке (сработает не во всех браузерах)
		window.addEventListener("load", playScream);

		// Если браузер заблокировал звук, он включится при первом касании или клике
		function onFirstInteraction() {
			playScream();
			["click", "touchstart", "keydown", "mousemove"].forEach(function (e) {
				document.removeEventListener(e, onFirstInteraction);
			});
		}
		["click", "touchstart", "keydown", "mousemove"].forEach(function (e) {
			document.addEventListener(e, onFirstInteraction);
		});
	</script>
</body>
</html>
